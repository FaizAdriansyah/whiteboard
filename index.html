<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1e1e1e">
    <title>Whiteboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
        }

        body {
            background: #2d2d2d;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            font-family: 'Segoe UI', Roboto, sans-serif;
            padding: 16px;
            overscroll-behavior: none;
        }

        .container {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            gap: 16px;
            max-width: 100%;
        }

        .main-area {
            display: flex;
            flex-direction: column;
            min-width: 0;
            flex: 1;
        }

        .whiteboard-wrapper {
            background: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #444;
            position: relative;
        }

        canvas {
            display: block;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 8 / 5;
            height: auto;
            cursor: crosshair;
            background: #ffffff;
            touch-action: none;
            -webkit-user-select: none;
        }

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 16px;
            gap: 12px;
            flex-wrap: wrap;
        }

        .tool-group {
            display: flex;
            align-items: center;
            gap: 16px;
            background: #2a2a2a;
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid #3a3a3a;
            flex-wrap: wrap;
        }

        .color-picker {
            display: flex;
            gap: 6px;
        }

        .color-btn {
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            outline: 1px solid #555;
            outline-offset: 1px;
            flex-shrink: 0;
        }

        .color-btn:hover {
            outline-color: #888;
        }

        .color-btn.active {
            outline: 2px solid #ffffff;
            outline-offset: 2px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #e0e0e0;
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        .slider-container label {
            color: #aaa;
        }

        input[type="range"] {
            width: 110px;
            height: 4px;
            -webkit-appearance: none;
            background: #444;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: #ffffff;
            border-radius: 50%;
            border: 1px solid #3a3a3a;
            cursor: pointer;
        }

        .size-value {
            min-width: 26px;
            text-align: center;
            background: #3a3a3a;
            padding: 4px 6px;
            border-radius: 4px;
            font-size: 0.8rem;
            color: #e0e0e0;
            font-variant-numeric: tabular-nums;
        }

        /* === Tombol emoji === */
        .btn {
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            color: #e0e0e0;
            font-weight: 600;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.15rem;
            transition: background 0.15s, color 0.15s, transform 0.1s;
            min-height: 42px;
            min-width: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: relative;
            line-height: 1;
        }

        .btn:hover {
            background: #3a3a3a;
        }

        .btn:active {
            background: #444;
            transform: scale(0.95);
        }

        .btn:hover::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            background: #000;
            color: #fff;
            font-size: 0.72rem;
            font-weight: 500;
            padding: 5px 9px;
            border-radius: 4px;
            white-space: nowrap;
            pointer-events: none;
            z-index: 20;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.4);
            opacity: 0;
            animation: tooltipFadeIn 0.15s ease-out forwards;
            letter-spacing: 0.2px;
        }

        @keyframes tooltipFadeIn {
            to { opacity: 1; }
        }

        .btn-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* Sidebar */
        .sidebar {
            width: 240px;
            background: #252525;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 640px;
            flex-shrink: 0;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar h2 {
            font-size: 0.85rem;
            color: #aaa;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .sidebar-toggle {
            display: none;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            color: #e0e0e0;
            border-radius: 4px;
            cursor: pointer;
            padding: 4px 10px;
            font-size: 1rem;
            min-height: 32px;
            min-width: 32px;
        }

        .sidebar-content {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
            min-height: 0;
        }

        .board-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow-y: auto;
            flex: 1;
            margin-bottom: 8px;
            max-height: 420px;
            min-height: 40px;
        }

        .board-item {
            background: #2f2f2f;
            border: 1px solid #3a3a3a;
            border-radius: 6px;
            padding: 10px 10px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.15s;
            gap: 6px;
            min-height: 44px;
        }

        .board-item:hover {
            background: #383838;
        }

        .board-item.active {
            border-color: #6bb8ff;
            background: #2f3540;
        }

        .board-name {
            font-size: 0.85rem;
            color: #e0e0e0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }

        .board-item.active .board-name {
            color: #ffffff;
            font-weight: 500;
        }

        .board-actions {
            display: flex;
            gap: 2px;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 1rem;
            line-height: 1;
            padding: 6px 8px;
            border-radius: 4px;
            display: none;
            min-width: 32px;
            min-height: 32px;
            position: relative;
        }

        .icon-btn:hover {
            background: #3a3a3a;
            color: #fff;
        }

        .icon-btn:hover::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: calc(100% + 6px);
            right: 0;
            background: #000;
            color: #fff;
            font-size: 0.7rem;
            font-weight: 500;
            padding: 4px 8px;
            border-radius: 4px;
            white-space: nowrap;
            pointer-events: none;
            z-index: 20;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.4);
            opacity: 0;
            animation: tooltipFadeIn 0.15s ease-out forwards;
        }

        .board-item.active .icon-btn,
        .board-item:hover .icon-btn {
            display: block;
        }

        .empty-state {
            color: #666;
            font-size: 0.8rem;
            text-align: center;
            padding: 16px 0;
            font-style: italic;
        }

        .new-board-row {
            display: flex;
            gap: 6px;
        }

        .new-board-input {
            flex: 1;
            background: #2f2f2f;
            border: 1px solid #3a3a3a;
            border-radius: 4px;
            padding: 8px 10px;
            color: #e0e0e0;
            font-size: 0.85rem;
            outline: none;
            font-family: inherit;
            min-width: 0;
            min-height: 42px;
        }

        .new-board-input:focus {
            border-color: #6bb8ff;
        }

        .new-board-input::placeholder {
            color: #666;
        }

        .status {
            font-size: 0.75rem;
            color: #888;
            text-align: center;
            min-height: 14px;
        }

        /* ============ RESPONSIVE ============ */

        @media (max-width: 1100px) {
            .container {
                flex-direction: column;
                gap: 12px;
                width: 100%;
                max-width: 820px;
            }

            .main-area {
                width: 100%;
            }

            canvas {
                max-width: 100%;
            }

            .sidebar {
                width: 100%;
                max-height: none;
            }

            .sidebar-header {
                cursor: pointer;
            }

            .sidebar-toggle {
                display: block;
            }

            .sidebar.collapsed .sidebar-content {
                display: none;
            }

            .board-list {
                max-height: 180px;
            }
        }

        @media (max-width: 640px) {
            body {
                padding: 8px;
                align-items: flex-start;
            }

            .container {
                padding: 10px;
                border-radius: 8px;
                gap: 10px;
            }

            .whiteboard-wrapper {
                border-radius: 6px;
            }

            .toolbar {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
                margin-top: 10px;
            }

            .tool-group {
                width: 100%;
                justify-content: space-between;
                padding: 6px 10px;
                gap: 10px;
            }

            .color-picker {
                gap: 5px;
                flex-wrap: wrap;
            }

            .color-btn {
                width: 28px;
                height: 28px;
            }

            .slider-container {
                flex: 1;
                justify-content: flex-end;
            }

            input[type="range"] {
                width: 100px;
            }

            .btn-row {
                width: 100%;
                display: grid;
                grid-template-columns: repeat(5, 1fr);
                gap: 6px;
            }

            .btn {
                padding: 8px;
                font-size: 1.1rem;
                width: 100%;
            }

            .sidebar {
                padding: 10px;
            }

            .sidebar h2 {
                font-size: 0.78rem;
            }

            .board-name {
                font-size: 0.8rem;
            }

            .icon-btn {
                display: block;
                color: #888;
            }

            .board-list {
                max-height: 150px;
            }
        }

        @media (max-width: 380px) {
            .btn-row {
                grid-template-columns: repeat(3, 1fr);
            }

            .color-btn {
                width: 24px;
                height: 24px;
            }

            .slider-container label {
                display: none;
            }
        }

        /* Layar sentuh: semua tombol sidebar selalu terlihat */
        @media (hover: none) and (pointer: coarse) {
            .icon-btn {
                display: block;
                color: #888;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-area">
            <div class="whiteboard-wrapper">
                <canvas id="whiteboardCanvas" width="800" height="500"></canvas>
            </div>

            <div class="toolbar">
                <div class="tool-group">
                    <div class="color-picker" id="colorPicker">
                        <button class="color-btn active" data-color="#000000" style="background: #000000;" title="Hitam"></button>
                        <button class="color-btn" data-color="#e74c3c" style="background: #e74c3c;" title="Merah"></button>
                        <button class="color-btn" data-color="#2ecc71" style="background: #2ecc71;" title="Hijau"></button>
                        <button class="color-btn" data-color="#3498db" style="background: #3498db;" title="Biru"></button>
                        <button class="color-btn" data-color="#f1c40f" style="background: #f1c40f;" title="Kuning"></button>
                        <button class="color-btn" data-color="#9b59b6" style="background: #9b59b6;" title="Ungu"></button>
                        <button class="color-btn" data-color="#e67e22" style="background: #e67e22;" title="Oranye"></button>
                    </div>

                    <div class="slider-container">
                        <label for="sizeSlider">Ukuran</label>
                        <input type="range" id="sizeSlider" min="1" max="40" value="6" step="1">
                        <span class="size-value" id="sizeValue">6</span>
                    </div>
                </div>

                <div class="btn-row">
                    <button class="btn" id="clearBtn" data-tooltip="Bersihkan kanvas">🗑️</button>
                    <button class="btn" id="copyBoardBtn" data-tooltip="Copy papan (duplikat)">📋</button>
                    <button class="btn" id="copyImgBtn" data-tooltip="Copy gambar ke clipboard">🖼️</button>
                    <button class="btn" id="exportJpgBtn" data-tooltip="Export ke JPG">💾</button>
                    <button class="btn" id="saveBtn" data-tooltip="Simpan manual">💿</button>
                </div>
            </div>
        </div>

        <div class="sidebar" id="sidebar">
            <div class="sidebar-header" id="sidebarHeader">
                <h2>Papan Gambar</h2>
                <button class="sidebar-toggle" id="sidebarToggle" data-tooltip="Tampilkan/sembunyikan">☰</button>
            </div>
            <div class="sidebar-content" id="sidebarContent">
                <ul class="board-list" id="boardList"></ul>
                <div class="new-board-row">
                    <input type="text" class="new-board-input" id="newBoardName" placeholder="Nama papan baru" maxlength="30">
                    <button class="btn" id="addBoardBtn" data-tooltip="Buat papan baru">➕</button>
                </div>
                <div class="status" id="status"></div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const STORAGE_KEY = 'whiteboard_app_v1';

            const canvas = document.getElementById('whiteboardCanvas');
            const ctx = canvas.getContext('2d');
            const boardList = document.getElementById('boardList');
            const newBoardName = document.getElementById('newBoardName');
            const statusEl = document.getElementById('status');
            const sidebar = document.getElementById('sidebar');
            const sidebarHeader = document.getElementById('sidebarHeader');
            const sidebarToggle = document.getElementById('sidebarToggle');

            // === State ===
            let isDrawing = false;
            let lastX = 0;
            let lastY = 0;
            let currentColor = '#000000';
            let currentSize = 6;
            let boards = [];
            let activeBoardId = null;
            let dirty = false;

            // === Responsif: sidebar collapse di layar kecil ===
            function isMobileView() {
                return window.matchMedia('(max-width: 1100px)').matches;
            }

            function updateSidebarCollapse() {
                if (isMobileView()) {
                    if (!sidebar.dataset.userToggled) {
                        sidebar.classList.add('collapsed');
                        sidebarToggle.textContent = '☰';
                    }
                } else {
                    sidebar.classList.remove('collapsed');
                }
            }

            sidebarHeader.addEventListener('click', (e) => {
                if (!isMobileView()) return;
                if (e.target.closest('button') && e.target !== sidebarToggle) return;

                const collapsed = sidebar.classList.toggle('collapsed');
                sidebar.dataset.userToggled = '1';
            });

            sidebarToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                if (!isMobileView()) return;
                sidebar.classList.toggle('collapsed');
                sidebar.dataset.userToggled = '1';
            });

            window.addEventListener('resize', updateSidebarCollapse);

            // === Helper localStorage ===
            function loadFromStorage() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (!raw) return { boards: [], activeBoardId: null };
                    const parsed = JSON.parse(raw);
                    return {
                        boards: Array.isArray(parsed.boards) ? parsed.boards : [],
                        activeBoardId: parsed.activeBoardId || null
                    };
                } catch (err) {
                    console.error('Gagal memuat localStorage:', err);
                    return { boards: [], activeBoardId: null };
                }
            }

            function saveToStorage() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify({
                        boards,
                        activeBoardId
                    }));
                    return true;
                } catch (err) {
                    console.error('Gagal menyimpan:', err);
                    setStatus('Gagal menyimpan: ' + err.name);
                    return false;
                }
            }

            // === Status ===
            function setStatus(msg) {
                statusEl.textContent = msg;
                if (msg) {
                    clearTimeout(setStatus._t);
                    setStatus._t = setTimeout(() => { statusEl.textContent = ''; }, 2200);
                }
            }

            // === Canvas ===
            function fillWhite() {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            function clearCanvas() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                fillWhite();
            }

            function loadImageToCanvas(dataURL) {
                if (!dataURL) {
                    clearCanvas();
                    return;
                }
                const img = new Image();
                img.onload = () => {
                    clearCanvas();
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                };
                img.onerror = () => clearCanvas();
                img.src = dataURL;
            }

            function getCanvasDataURL() {
                return canvas.toDataURL('image/png');
            }

            // === Papan ===
            function uid() {
                return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
            }

            function getActiveBoard() {
                return boards.find(b => b.id === activeBoardId) || null;
            }

            function renderBoardList() {
                boardList.innerHTML = '';

                if (boards.length === 0) {
                    const li = document.createElement('li');
                    li.className = 'empty-state';
                    li.textContent = 'Belum ada papan.';
                    boardList.appendChild(li);
                    return;
                }

                boards.forEach(board => {
                    const li = document.createElement('li');
                    li.className = 'board-item' + (board.id === activeBoardId ? ' active' : '');

                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'board-name';
                    nameSpan.textContent = board.name;
                    nameSpan.title = board.name;
                    li.appendChild(nameSpan);

                    const actions = document.createElement('div');
                    actions.className = 'board-actions';

                    const copyBtn = document.createElement('button');
                    copyBtn.className = 'icon-btn copy';
                    copyBtn.setAttribute('data-tooltip', 'Duplikat papan');
                    copyBtn.textContent = '📋';
                    copyBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        duplicateBoard(board.id);
                    });
                    actions.appendChild(copyBtn);

                    const exportBtn = document.createElement('button');
                    exportBtn.className = 'icon-btn export';
                    exportBtn.setAttribute('data-tooltip', 'Export JPG');
                    exportBtn.textContent = '💾';
                    exportBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        exportBoardToJPG(board.id);
                    });
                    actions.appendChild(exportBtn);

                    const delBtn = document.createElement('button');
                    delBtn.className = 'icon-btn del';
                    delBtn.setAttribute('data-tooltip', 'Hapus papan');
                    delBtn.textContent = '❌';
                    delBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        deleteBoard(board.id);
                    });
                    actions.appendChild(delBtn);

                    li.appendChild(actions);
                    li.addEventListener('click', () => switchBoard(board.id));
                    boardList.appendChild(li);
                });
            }

            function persistActiveBoard() {
                const board = getActiveBoard();
                if (!board) return false;
                board.dataURL = getCanvasDataURL();
                board.updatedAt = Date.now();
                return saveToStorage();
            }

            function switchBoard(id) {
                if (id === activeBoardId) return;
                if (activeBoardId) persistActiveBoard();

                activeBoardId = id;
                const board = getActiveBoard();
                loadImageToCanvas(board ? board.dataURL : null);
                saveToStorage();
                renderBoardList();
                setStatus('Papan dibuka');

                if (isMobileView() && !sidebar.classList.contains('collapsed')) {
                    sidebar.classList.add('collapsed');
                }
            }

            function createBoard(name) {
                if (activeBoardId) persistActiveBoard();

                const newBoard = {
                    id: uid(),
                    name: name || 'Papan ' + (boards.length + 1),
                    dataURL: null,
                    updatedAt: Date.now()
                };
                boards.push(newBoard);
                activeBoardId = newBoard.id;
                clearCanvas();
                saveToStorage();
                renderBoardList();
                setStatus('Papan dibuat');
            }

            function deleteBoard(id) {
                const idx = boards.findIndex(b => b.id === id);
                if (idx === -1) return;
                if (boards.length === 1) {
                    if (!confirm('Hapus papan terakhir? Kanvas akan dikosongkan.')) return;
                }

                boards.splice(idx, 1);

                if (activeBoardId === id) {
                    activeBoardId = boards.length > 0 ? boards[0].id : null;
                    if (activeBoardId) {
                        const b = getActiveBoard();
                        loadImageToCanvas(b.dataURL);
                    } else {
                        clearCanvas();
                    }
                }

                saveToStorage();
                renderBoardList();
                setStatus('Papan dihapus');
            }

            function duplicateBoard(sourceId) {
                const source = boards.find(b => b.id === sourceId);
                if (!source) return;

                if (sourceId === activeBoardId) {
                    source.dataURL = getCanvasDataURL();
                }

                let baseName = source.name.replace(/\s*\(copy( \d+)?\)$/i, '');
                let candidate = baseName + ' (copy)';
                let counter = 2;
                while (boards.some(b => b.name === candidate)) {
                    candidate = baseName + ' (copy ' + counter + ')';
                    counter++;
                }

                const newBoard = {
                    id: uid(),
                    name: candidate,
                    dataURL: source.dataURL || null,
                    updatedAt: Date.now()
                };

                const idx = boards.findIndex(b => b.id === sourceId);
                boards.splice(idx + 1, 0, newBoard);

                saveToStorage();
                renderBoardList();
                setStatus('Papan diduplikat');
            }

            async function copyImageToClipboard() {
                if (!activeBoardId) {
                    setStatus('Tidak ada papan aktif');
                    return;
                }

                canvas.toBlob(async (blob) => {
                    if (!blob) {
                        setStatus('Gagal membuat gambar');
                        return;
                    }

                    if (navigator.clipboard && window.ClipboardItem) {
                        try {
                            await navigator.clipboard.write([
                                new ClipboardItem({ 'image/png': blob })
                            ]);
                            setStatus('Gambar disalin ke clipboard');
                            return;
                        } catch (err) {
                            console.warn('Clipboard API gagal:', err);
                        }
                    }

                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = (getActiveBoard()?.name || 'whiteboard') + '.png';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    setTimeout(() => URL.revokeObjectURL(url), 1000);
                    setStatus('Clipboard tidak didukung, gambar diunduh');
                }, 'image/png');
            }

            function exportBoardToJPG(boardId) {
                const targetId = boardId || activeBoardId;
                if (!targetId) {
                    setStatus('Tidak ada papan aktif');
                    return;
                }

                const board = boards.find(b => b.id === targetId);
                if (!board) {
                    setStatus('Papan tidak ditemukan');
                    return;
                }

                let sourceDataURL;
                if (targetId === activeBoardId) {
                    sourceDataURL = getCanvasDataURL();
                } else {
                    sourceDataURL = board.dataURL;
                }

                if (!sourceDataURL) {
                    if (!confirm('Papan "' + board.name + '" kosong. Tetap export sebagai JPG putih?')) {
                        return;
                    }
                }

                const offscreen = document.createElement('canvas');
                offscreen.width = canvas.width;
                offscreen.height = canvas.height;
                const octx = offscreen.getContext('2d');

                octx.fillStyle = '#ffffff';
                octx.fillRect(0, 0, offscreen.width, offscreen.height);

                function finishExport() {
                    const jpgURL = offscreen.toDataURL('image/jpeg', 0.92);

                    const safeName = (board.name || 'whiteboard')
                        .replace(/[^\w\s\-\.]/g, '')
                        .replace(/\s+/g, '_')
                        .trim() || 'whiteboard';

                    const fileName = safeName + '.jpg';

                    const a = document.createElement('a');
                    a.href = jpgURL;
                    a.download = fileName;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);

                    setStatus('Diekspor: ' + fileName);
                }

                if (!sourceDataURL) {
                    finishExport();
                    return;
                }

                const img = new Image();
                img.onload = () => {
                    octx.drawImage(img, 0, 0, offscreen.width, offscreen.height);
                    finishExport();
                };
                img.onerror = () => {
                    setStatus('Gagal memuat gambar papan');
                };
                img.src = sourceDataURL;
            }

            // === Gambar ===
            function getCoordinates(e) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;

                let clientX, clientY;
                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }

                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            }

            function startDrawing(e) {
                e.preventDefault();
                if (!activeBoardId) {
                    setStatus('Buat papan dulu');
                    return;
                }
                const { x, y } = getCoordinates(e);
                isDrawing = true;
                lastX = x;
                lastY = y;
                dirty = true;

                ctx.beginPath();
                ctx.arc(lastX, lastY, currentSize / 2, 0, Math.PI * 2);
                ctx.fillStyle = currentColor;
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
            }

            function draw(e) {
                e.preventDefault();
                if (!isDrawing) return;

                const { x, y } = getCoordinates(e);

                ctx.strokeStyle = currentColor;
                ctx.lineWidth = currentSize;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(x, y);
                ctx.stroke();

                lastX = x;
                lastY = y;
            }

            function stopDrawing(e) {
                if (e) e.preventDefault();
                isDrawing = false;
            }

            let autoSaveTimer = null;
            function scheduleAutoSave() {
                if (!activeBoardId) return;
                clearTimeout(autoSaveTimer);
                autoSaveTimer = setTimeout(() => {
                    if (activeBoardId) {
                        persistActiveBoard();
                        setStatus('Tersimpan otomatis');
                    }
                }, 800);
            }

            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', () => { stopDrawing(); scheduleAutoSave(); });
            canvas.addEventListener('mouseleave', stopDrawing);

            canvas.addEventListener('touchstart', startDrawing, { passive: false });
            canvas.addEventListener('touchmove', draw, { passive: false });
            canvas.addEventListener('touchend', () => { stopDrawing(); scheduleAutoSave(); });
            canvas.addEventListener('touchcancel', stopDrawing);

            canvas.addEventListener('contextmenu', (e) => e.preventDefault());

            const colorButtons = document.querySelectorAll('.color-btn');
            colorButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    colorButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentColor = btn.dataset.color;
                });
            });

            const sizeSlider = document.getElementById('sizeSlider');
            const sizeValue = document.getElementById('sizeValue');
            sizeSlider.addEventListener('input', (e) => {
                const val = parseInt(e.target.value, 10);
                currentSize = val;
                sizeValue.textContent = val;
            });

            document.getElementById('clearBtn').addEventListener('click', () => {
                if (!activeBoardId) return;
                if (!confirm('Hapus semua coretan di papan ini?')) return;
                clearCanvas();
                persistActiveBoard();
                setStatus('Papan dibersihkan');
            });

            document.getElementById('copyBoardBtn').addEventListener('click', () => {
                if (!activeBoardId) {
                    setStatus('Tidak ada papan aktif');
                    return;
                }
                duplicateBoard(activeBoardId);
            });

            document.getElementById('copyImgBtn').addEventListener('click', copyImageToClipboard);

            document.getElementById('exportJpgBtn').addEventListener('click', () => exportBoardToJPG(activeBoardId));

            document.getElementById('saveBtn').addEventListener('click', () => {
                if (!activeBoardId) {
                    setStatus('Tidak ada papan aktif');
                    return;
                }
                if (persistActiveBoard()) {
                    setStatus('Disimpan');
                    renderBoardList();
                }
            });

            document.getElementById('addBoardBtn').addEventListener('click', () => {
                const name = newBoardName.value.trim();
                if (!name) {
                    newBoardName.focus();
                    return;
                }
                createBoard(name);
                newBoardName.value = '';
            });

            newBoardName.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    document.getElementById('addBoardBtn').click();
                }
            });

            function init() {
                const stored = loadFromStorage();
                boards = stored.boards;
                activeBoardId = stored.activeBoardId;

                if (activeBoardId && !boards.find(b => b.id === activeBoardId)) {
                    activeBoardId = boards.length > 0 ? boards[0].id : null;
                }

                if (boards.length === 0) {
                    const b = { id: uid(), name: 'Papan 1', dataURL: null, updatedAt: Date.now() };
                    boards.push(b);
                    activeBoardId = b.id;
                    saveToStorage();
                }

                const active = getActiveBoard();
                if (active && active.dataURL) {
                    loadImageToCanvas(active.dataURL);
                } else {
                    fillWhite();
                }

                renderBoardList();
                updateSidebarCollapse();

                window.addEventListener('beforeunload', () => {
                    if (activeBoardId && dirty) {
                        persistActiveBoard();
                    }
                });
            }

            init();
        })();
    </script>
</body>
</html>
